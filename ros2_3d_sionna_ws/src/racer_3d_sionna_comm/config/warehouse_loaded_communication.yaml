    mode: sionna_hybrid
    range_only_m: 12.0
    bandwidth_hz: 20000000.0
    mac_efficiency: 0.55
    base_latency_ms: 20.0
    jitter_ms: 10.0
    queue_capacity_bytes: 262144
    mtu_bytes: 1200
    snr_midpoint_db: 7.0
