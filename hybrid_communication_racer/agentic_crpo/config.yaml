seed: 42
n_uavs: 10

qwen:
  enabled: true
  model_path: /home/jiazheng/ai_models/Qwen3-14B-FP8
  device: auto
  dtype: bfloat16
  local_files_only: true
  max_new_tokens: 1024
  normalize_omega: true
  # This local checkpoint is FP8. Dequantize locally to dtype so Transformers
  # never tries to fetch a separately distributed FP8 execution kernel.
  dequantize_fp8: true
  async_llm: true
  load_in_8bit: false
  load_in_4bit: false

environment:
  high_level_interval: 50
  channel_history: 50
  # Half of the previous 66-PRB normalization because the BS owns the
  # dedicated 50 MHz / 33-PRB half of the 100 MHz carrier.
  bs_resource_normalizer: 1650.0
  backend:
    kind: file_bridge
    action_path: /tmp/racer_agentic_crpo/action.txt
    telemetry_path: /tmp/racer_agentic_crpo/communication_state.json
    mission_state_path: /tmp/racer_agentic_crpo/mission_state.json
    # Set this to the matching ideal/perfect-communication result generated
    # with trajectory history enabled before starting a real training run.
    perfect_reference_result: null
    require_mission_state: true
    require_perfect_reference: true
    redundancy_cell_m: 1.0
    fixed_exploration_time_s: 300.0
    # Reject old references that do not contain measured perfect redundancy
    # and perfect global-map IoU histories.
    require_auxiliary_reference_metrics: true
    timeout_s: 5.0
    poll_interval_s: 0.002
    horizon: 128
    mock_direct_u2u_resource: 11.0
  normalization:
    position_min: [-27.0, 0.6, 0.4]
    position_max: [6.0, 30.6, 8.4]
    snr_min_db: -20.0
    snr_max_db: 40.0
    max_aoi_s: 30.0
    max_missing_bytes: 4000000.0
    max_queue_bytes: 4000000.0

task_loss:
  alpha_traj: 0.30
  alpha_cov: 0.30
  alpha_red: 0.10
  alpha_map: 0.30

constraint:
  calibration_mode: baseline_gap
  rho: 0.25
  # A non-null manual value is authoritative. Set to null after collecting
  # paired baselines to enable baseline-gap calibration.
  gamma_task: 0.15
  eta: 0.01
  distributed_only_results: []
  full_bs_results: []
  telescoping_tolerance: 1.0e-6

crpo:
  gamma_reward: 1.0
  gamma_cost: 1.0
  gae_lambda_reward: 0.95
  gae_lambda_cost: 0.95
  constraint_estimator: episode_return
  episode_cost_window: 20
  ppo:
    learning_rate: 0.0003
    n_steps: 256
    batch_size: 64
    n_epochs: 10
    activation_fn: silu
    clip_range: 0.2
    ent_coef: 0.01
    reward_vf_coef: 0.5
    cost_vf_coef: 0.5
    max_grad_norm: 0.5
    target_kl: 0.03
    normalize_advantage: true
    net_arch:
      pi: [128]
      vf: [128]

training:
  mode: train
  device: cpu
  total_timesteps: 1000000
  smoke_timesteps: 64
  checkpoint_interval: 10000
  output_dir: ./agentic_crpo/runs/qwen14b_crpo
  verbose: 1
