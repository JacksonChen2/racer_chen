/**:
  ros__parameters:
    # ROS1 RACER simulator/exploration launch values.
    map_resolution: 0.10
    # Legacy parameter name: these are the ROS1 sdf_map raycast limits.
    minimum_sensor_range: 0.50
    lidar_range: 4.50
    maximum_sensor_rays: 2400
    planning_clearance: 0.38
    # Execution margins include the generated model's 0.284 m collision
    # radius plus rigid-body tracking and depth-frame latency allowances.
    control_clearance: 0.52
    swarm_safe_distance: 1.20
    emergency_distance: 1.35
    max_speed: 0.85
    max_acceleration: 0.80
    guaranteed_deceleration: 0.60
    safety_response_time: 0.20
    planning_period: 0.5
    pairwise_period: 0.5
    peer_timeout: 3.0
    completion_coverage: 0.90
    hgrid_levels: 2
    use_sim_time: false
