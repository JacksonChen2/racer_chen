# Isaac Sim 5.1 ROS 2 Bridge contract. One namespace is created per vehicle.
clock: /clock
drone_namespace_pattern: /drone_{id}
odometry: odometry
pointcloud: pointcloud
position_command: position_cmd
velocity_command: isaac/velocity_command
acceleration_command: isaac/acceleration_command
pose_command: isaac/pose_command
frames:
  world: world
  base_pattern: drone_{id}/base_link
qos:
  odometry: sensor_data
  pointcloud: sensor_data
  commands: reliable

