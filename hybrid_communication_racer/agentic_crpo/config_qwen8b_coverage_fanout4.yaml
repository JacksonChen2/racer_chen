algorithm:
  variant: qwen8b_coverage_fanout4

seed: 42
n_uavs: 10

qwen:
  enabled: true
  model_path: /home/jiazheng/ai_models/Qwen3-8B-FP8
  backend: vllm
  device: auto
  dtype: bfloat16
  local_files_only: true
  max_new_tokens: 1024
  normalize_omega: true
  dequantize_fp8: false
  async_llm: true
  load_in_8bit: false
  load_in_4bit: false
  prompt_variant: compact_nonzero_schema
  vllm:
    quantization: fp8
    linear_backend: cutlass
    gpu_memory_utilization: 0.25
    max_model_len: 8192
    max_num_seqs: 1
    enforce_eager: false
    enable_prefix_caching: false
    disable_deep_gemm: true
    disable_flashinfer_sampler: true
    seed: 42

# Fixed-horizon coverage AUC objective.  The reward at every fine slot is the
# latest measured team coverage in [0, 1].  Hold-last behavior between mapper
# updates is intentional and does not synthesize new coverage observations.
reward:
  type: coverage
  scale: 1.0

environment:
  high_level_interval: 50
  channel_history: 50
  bs_resource_normalizer: 1650.0
  backend:
    kind: file_bridge
    # Separate bridge files prevent collision with the retained Qwen-14B run.
    action_path: /tmp/racer_agentic_crpo_qwen8b_fanout4/action.txt
    telemetry_path: /tmp/racer_agentic_crpo_qwen8b_fanout4/communication_state.json
    mission_state_path: /tmp/racer_agentic_crpo_qwen8b_fanout4/mission_state.json
    # Coverage reward and fan-out cost do not use a perfect-communication
    # trajectory, so the problematic regenerated 36.73% reference is excluded.
    perfect_reference_result: null
    require_mission_state: true
    require_perfect_reference: false
    require_auxiliary_reference_metrics: false
    redundancy_cell_m: 1.0
    fixed_exploration_time_s: 300.0
    timeout_s: 5.0
    poll_interval_s: 0.002
    horizon: 128
    mock_direct_u2u_resource: 11.0
  normalization:
    position_min: [-27.0, 0.6, 0.4]
    position_max: [6.0, 30.6, 8.4]
    snr_min_db: -20.0
    snr_max_db: 40.0
    max_aoi_s: 30.0
    max_missing_bytes: 4000000.0
    max_queue_bytes: 4000000.0

# Retained only for task-quality diagnostics; it is not this variant's CRPO
# constraint and does not enter either reward or cost.
task_loss:
  alpha_traj: 0.30
  alpha_cov: 0.30
  alpha_red: 0.10
  alpha_map: 0.30

constraint:
  type: relay_fanout
  max_relay_recipients_per_uav: 4
  hard_enforcement: true
  # CRPO observes the worst proposed overflow, normalized to [0, 1].  The
  # permitted overflow is zero; hard projection separately guarantees safety.
  gamma_task: 0.0
  eta: 0.0
  calibration_mode: manual
  rho: 0.25
  telescoping_tolerance: 1.0e-6
  projection_priority_weights:
    task_dependency: 0.70
    relay_queue: 0.15
    aoi: 0.10
    downlink_snr: 0.05
  distributed_only_results: []
  full_bs_results: []

crpo:
  gamma_reward: 1.0
  gamma_cost: 1.0
  gae_lambda_reward: 0.95
  gae_lambda_cost: 0.95
  # Estimate the policy's attempted fan-out violation rate rather than the
  # terminal task loss used by the original Qwen-14B variant.
  constraint_estimator: mean_step_cost
  episode_cost_window: 20
  ppo:
    learning_rate: 0.0002
    n_steps: 384
    batch_size: 64
    n_epochs: 10
    activation_fn: silu
    clip_range: 0.2
    ent_coef: 0.01
    reward_vf_coef: 0.5
    cost_vf_coef: 0.5
    max_grad_norm: 0.5
    target_kl: 0.03
    normalize_advantage: true
    net_arch:
      pi: [128]
      vf: [128]

training:
  mode: train
  device: cpu
  total_timesteps: 1000000
  smoke_timesteps: 64
  checkpoint_interval: 10000
  output_dir: ./agentic_crpo/runs/qwen8b_coverage_fanout4
  verbose: 1
