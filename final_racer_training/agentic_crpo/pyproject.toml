[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "final-racer-agentic-crpo"
version = "0.1.0"
description = "Minimal Qwen3-8B-FP8 plus dual-encoder CRPO training layer for final_racer"
requires-python = ">=3.10"
dependencies = [
  "gymnasium>=0.29,<2",
  "numpy>=1.24,<3",
  "PyYAML>=6",
  "stable-baselines3>=2.6,<3",
  "tensorboard>=2.14",
  "torch>=2.1,<3",
  "transformers>=4.51,<6",
]

[project.optional-dependencies]
# The discovered checkpoint is already FP8. Transformers requires Accelerate
# to materialize that format; no bitsandbytes dependency is installed.
fp8 = ["accelerate>=1,<2"]
vllm = ["vllm>=0.27,<0.28"]

[project.scripts]
racer-train-crpo = "agentic_crpo.train_crpo:main"

[tool.setuptools.packages.find]
include = ["agentic_crpo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
