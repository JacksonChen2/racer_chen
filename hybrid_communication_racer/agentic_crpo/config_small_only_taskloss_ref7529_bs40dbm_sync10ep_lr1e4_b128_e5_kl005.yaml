algorithm:
  variant: small_only_crpo_resource_taskloss_ref7529_bs40dbm_sync10ep_lr1e4_b128_e5_kl005

seed: 42
n_uavs: 10

qwen:
  enabled: false
  async_llm: false
  single_gpu_pause:
    enabled: false

environment:
  include_global_guidance: false
  high_level_interval: 250
  channel_history: 50
  bs_resource_normalizer: 1650.0
  backend:
    kind: file_bridge
    action_path: /tmp/racer_agentic_crpo_small_only_taskloss_ref7529_bs40dbm_sync10ep_lr1e4_b128_e5_kl005/action.txt
    telemetry_path: /tmp/racer_agentic_crpo_small_only_taskloss_ref7529_bs40dbm_sync10ep_lr1e4_b128_e5_kl005/communication_state.json
    mission_state_path: /tmp/racer_agentic_crpo_small_only_taskloss_ref7529_bs40dbm_sync10ep_lr1e4_b128_e5_kl005/mission_state.json
    # Injected by the supervisor from the complete 75.2913% passive-metric run.
    perfect_reference_result: null
    auxiliary_reference_result: null
    require_mission_state: true
    require_perfect_reference: true
    redundancy_cell_m: 1.0
    fixed_exploration_time_s: 300.0
    require_auxiliary_reference_metrics: true
    timeout_s: 700.0
    poll_interval_s: 0.002
    synchronous_online:
      enabled: true
      acknowledgement_path: /tmp/racer_agentic_crpo_small_only_taskloss_ref7529_bs40dbm_sync10ep_lr1e4_b128_e5_kl005/rl_sync_ack.json
      release_path: /tmp/racer_agentic_crpo_small_only_taskloss_ref7529_bs40dbm_sync10ep_lr1e4_b128_e5_kl005/rl_sync_release.json
      communication_slot_s: 0.02
      decision_interval_s: 0.10
      slots_per_decision: 5
    horizon: 128
    mock_direct_u2u_resource: 11.0
  normalization:
    position_min: [-27.0, 0.6, 0.4]
    position_max: [6.0, 30.6, 8.4]
    snr_min_db: -20.0
    snr_max_db: 40.0
    max_aoi_s: 30.0
    max_missing_bytes: 4000000.0
    max_queue_bytes: 4000000.0

reward:
  type: negative_bs_resource
  scale: 1.0

task_loss:
  alpha_traj: 0.30
  alpha_cov: 0.30
  alpha_red: 0.10
  alpha_map: 0.30

constraint:
  type: task_loss
  calibration_mode: baseline_gap
  rho: 0.25
  gamma_task: 0.15
  eta: 0.01
  distributed_only_results: []
  full_bs_results: []
  telescoping_tolerance: 1.0e-6

crpo:
  gamma_reward: 1.0
  gamma_cost: 1.0
  gae_lambda_reward: 0.95
  gae_lambda_cost: 0.95
  constraint_estimator: episode_return
  episode_cost_window: 30
  ppo:
    learning_rate: 0.0001
    n_steps: 384
    batch_size: 128
    n_epochs: 5
    activation_fn: tanh
    clip_range: 0.2
    ent_coef: 0.01
    reward_vf_coef: 0.5
    cost_vf_coef: 0.5
    max_grad_norm: 0.5
    target_kl: 0.05
    normalize_advantage: true
    net_arch:
      pi: [512, 256, 256]
      vf: [512, 256, 256]

training:
  mode: train
  device: cpu
  total_timesteps: 100000
  smoke_timesteps: 64
  checkpoint_interval: 10000
  output_dir: ./agentic_crpo/runs/small_only_taskloss_ref7529_bs40dbm_sync10ep_lr1e4_b128_e5_kl005
  verbose: 1
